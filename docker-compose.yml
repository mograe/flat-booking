services:
  bot:
    build: .
    env_file: .env
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - studio_data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  studio_data:
